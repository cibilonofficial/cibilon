services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cibilon}
      POSTGRES_USER: ${POSTGRES_USER:-cibilon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cibilon} -d ${POSTGRES_DB:-cibilon}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      target: migrate
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      API_HOST: 0.0.0.0
    volumes:
      - document_data:/app/storage/documents
      - export_data:/app/storage/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - export_data:/app/storage/exports
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres_data:
  document_data:
  export_data:

networks:
  internal:
